<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Portal - Administrative</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#eef3f9;
}

/* Header */

header{
    background:#0d6efd;
    color:white;
    padding:20px;
    text-align:center;
}

/* Container */

.container{
    width:90%;
    margin:40px auto;
}

/* Cards */

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
}

.card{
    background:white;
    padding:25px;
    border-radius:12px;
    text-align:center;
    box-shadow:0 4px 10px rgba(0,0,0,0.15);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-8px);
}

.card h2{
    color:#0d6efd;
    margin-bottom:15px;
}

.card p{
    color:#666;
    margin-bottom:20px;
}

.card a{
    text-decoration:none;
    background:#0d6efd;
    color:white;
    padding:10px 20px;
    border-radius:6px;
    display:inline-block;
}

.card a:hover{
    background:#084298;
}

/* Back Button */

.back{
    text-align:center;
    margin-top:40px;
}

.back a{
    text-decoration:none;
    background:#6c757d;
    color:white;
    padding:12px 25px;
    border-radius:6px;
}

.back a:hover{
    background:#495057;
}

</style>

</head>
<body>

<header>
    <h1>Administrative Services</h1>
    <p>Access all administrative facilities from here.</p>
</header>

<div class="container">

<div class="cards">

<div class="card">
    <h2>📝 Exam Schedule</h2>
    <p>View upcoming examination timetable.</p>
    <a href="examschedule.html">Open</a>
</div>

<div class="card">
    <h2>📚 Study Material</h2>
    <p>Download notes, assignments and resources.</p>
    <a href="material.html">Open</a>
</div>

<div class="card">
    <h2>💳 Fees & Payment</h2>
    <p>Check fee status and make online payments.</p>
    <a href="fees.html">Open</a>
</div>

</div>

<div class="back">
    <a href="dashboard.html">⬅ Back to Dashboard</a>
</div>

</div>

</body>
</html>
